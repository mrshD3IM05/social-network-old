services:
  backend:
    build: ./backend
    volumes:
      - backend-data:/app

  frontend:
    build: ./frontend
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    depends_on:
      - frontend
    ports:
      - "8000:80"
    volumes:
      - ./caddy/Caddyfile.docker:/etc/caddy/Caddyfile:ro

volumes:
  backend-data:
